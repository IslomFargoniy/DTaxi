name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dtaxi
          POSTGRES_PASSWORD: dtaxi
          POSTGRES_DB: dtaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dtaxi
      DB_USERNAME: dtaxi
      DB_PASSWORD: dtaxi
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create test database
        run: |
          PGPASSWORD=dtaxi psql -h 127.0.0.1 -U dtaxi -d dtaxi -c "CREATE DATABASE dtaxi_test"
          PGPASSWORD=dtaxi psql -h 127.0.0.1 -U dtaxi -d dtaxi_test -c "CREATE EXTENSION postgis; CREATE EXTENSION pg_trgm;"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests and debug build
        run: ./gradlew :core:testDebugUnitTest :driver:testDebugUnitTest :driver:assembleDebug :client:testDebugUnitTest :client:assembleDebug --console=plain -Pfirm=dev
