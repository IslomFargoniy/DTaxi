name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ibtaxi
          POSTGRES_PASSWORD: ibtaxi
          POSTGRES_DB: ibtaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibtaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ibtaxi
      DB_USERNAME: ibtaxi
      DB_PASSWORD: ibtaxi
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create test database
        run: |
          PGPASSWORD=ibtaxi psql -h 127.0.0.1 -U ibtaxi -d ibtaxi -c "CREATE DATABASE ibtaxi_test"
          PGPASSWORD=ibtaxi psql -h 127.0.0.1 -U ibtaxi -d ibtaxi_test -c "CREATE EXTENSION postgis; CREATE EXTENSION pg_trgm;"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
