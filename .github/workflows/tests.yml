name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dtaxi
          POSTGRES_PASSWORD: dtaxi
          POSTGRES_DB: dtaxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtaxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dtaxi
      DB_USERNAME: dtaxi
      DB_PASSWORD: dtaxi
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, redis, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create test database
        run: |
          PGPASSWORD=dtaxi psql -h 127.0.0.1 -U dtaxi -d dtaxi -c "CREATE DATABASE dtaxi_test"
          PGPASSWORD=dtaxi psql -h 127.0.0.1 -U dtaxi -d dtaxi_test -c "CREATE EXTENSION postgis; CREATE EXTENSION pg_trgm;"

      - name: Setup Application
        run: composer setup

      # Har tekshiruv alohida qadam: qaysi biri yiqilgani jurnalsiz ham ko'rinadi, xatolar annotatsiyada
      - name: Frontend format and lint
        run: npm run check

      - name: TypeScript
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log; s=${PIPESTATUS[0]}; grep 'error TS' /tmp/tsc.log | head -20 | sed 's/^/::error::/'; exit $s

      - name: Pint
        run: vendor/bin/pint --parallel --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Tests
        run: |
          php artisan config:clear
          php artisan test --log-junit /tmp/junit.xml 2>&1 | tee /tmp/test.log; s=${PIPESTATUS[0]}
          grep -E 'FAILED|Exception|Error' /tmp/test.log | head -30 | sed 's/^/::error::/'
          exit $s

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests and debug build
        run: ./gradlew :core:testDebugUnitTest :driver:testDebugUnitTest :driver:assembleDebug :client:testDebugUnitTest :client:assembleDebug --console=plain -Pfirm=dev
