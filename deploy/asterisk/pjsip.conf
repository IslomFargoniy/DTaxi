; Dtaxi — PJSIP. Transportlar shu faylda, endpoint/aor/auth/trunk — PostgreSQL Realtime (sorcery.conf).
; Andoza: panel.1call.uz (deploy/asterisk/pjsip.conf)

[global]
type=global
user_agent=Dtaxi
endpoint_identifier_order=ip,username,anonymous
; Ichki raqamlar md5 (md5_cred) bilan — realm App\Services\Telephony\Extensions::REALM bilan bir xil bo'lishi shart
default_realm=asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address={{PUBLIC_IP}}
external_signaling_address={{PUBLIC_IP}}
local_net={{LOCAL_NET}}

; TCP talab qiladigan provayderlar uchun (trunk formasida "Transport: TCP")
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address={{PUBLIC_IP}}
external_signaling_address={{PUBLIC_IP}}
local_net={{LOCAL_NET}}

; Operator brauzeri va haydovchi ilovasi (WebRTC): WebSocket Nginx orqali (https://<domen>/ws)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
