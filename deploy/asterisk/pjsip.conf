; ibTaxi — PJSIP. Transportlar shu faylda, endpoint/aor/auth/trunk — PostgreSQL Realtime (sorcery.conf).
; Andoza: panel.1call.uz (deploy/asterisk/pjsip.conf)

[global]
type=global
user_agent=ibTaxi
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address={{PUBLIC_IP}}
external_signaling_address={{PUBLIC_IP}}
local_net={{LOCAL_NET}}

; Operator brauzeri va haydovchi ilovasi (WebRTC): WebSocket Nginx orqali (https://<domen>/ws)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
