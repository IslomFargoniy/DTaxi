; ibTaxi dialplan — barcha qo'ng'iroqlar Stasis (ARI) ilovasiga: operatorga ulash, IVR, yozib olish,
; avto-qo'ng'iroqlar Laravel'dagi `php artisan ari:listen` tomonidan boshqariladi (andoza: panel.1call.uz).

[general]
static=yes
writeprotect=yes

; SIP trunkdan (Sarkor va h.k.) kiruvchi — EXTEN = chaqirilgan raqam (DID)
[from-trunk]
exten => _X.,1,NoOp(ibTaxi inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(ibtaxi,inbound,${EXTEN})
 same => n,Hangup()
exten => s,1,Stasis(ibtaxi,inbound,s)
 same => n,Hangup()

; Operator va haydovchi WebRTC endpointlari: raqam, "dispatcher" (haydovchi ilovasi), "dr5" (operator → haydovchi)
[from-internal]
exten => _[0-9a-zA-Z+].,1,Stasis(ibtaxi,internal,${EXTEN})
 same => n,Hangup()

; Faol bo'lmagan foydalanuvchilar
[inactive]
exten => _X.,1,Hangup()
