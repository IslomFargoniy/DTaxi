; Dtaxi dialplan — barcha qo'ng'iroqlar Stasis (ARI) ilovasiga: operatorga ulash, IVR, yozib olish,
; avto-qo'ng'iroqlar Laravel'dagi `php artisan ari:listen` tomonidan boshqariladi (andoza: panel.1call.uz).

[general]
static=yes
writeprotect=yes

; SIP trunkdan (Sarkor va h.k.) kiruvchi — EXTEN = chaqirilgan raqam (DID)
[from-trunk]
exten => _X.,1,NoOp(Dtaxi inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(dtaxi,inbound,${EXTEN})
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?stasis-failed,1)
 same => n,Hangup()
exten => s,1,Stasis(dtaxi,inbound,s)
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?stasis-failed,1)
 same => n,Hangup()
; ari:listen ishlamayapti (Stasis ilovasi ro'yxatda yo'q): mijoz jimlikda uzilmasin — "liniyalar band, keyinroq qo'ng'iroq qiling"
; (panelda yaratilgan ovoz bo'lsa), aks holda band signali
exten => stasis-failed,1,NoOp(Dtaxi: Stasis ishlamadi)
 same => n,GotoIf(${STAT(e,${ASTDATADIR}/sounds/dtaxi/ivr/lines-busy.sln)}?play)
 same => n,Congestion(5)
 same => n,Hangup()
 same => n(play),Answer()
 same => n,Playback(dtaxi/ivr/lines-busy)
 same => n,Hangup()

; Operator va haydovchi WebRTC endpointlari: raqam, "dispatcher" (haydovchi ilovasi), "dr5" (operator → haydovchi)
[from-internal]
exten => _[0-9a-zA-Z+].,1,Stasis(dtaxi,internal,${EXTEN})
 same => n,GotoIf($["${STASISSTATUS}" = "FAILED"]?stasis-failed,1)
 same => n,Hangup()
; Brauzer/ilova "ulanmadi" ko'rsatadi
exten => stasis-failed,1,Congestion(5)
 same => n,Hangup()

; Mijoz ilovasi (qaror #72, vaqtinchalik cl{N}): faqat biriktirilgan haydovchiga yoki dispetcherga — boshqa raqam yo'q
[from-client]
exten => driver,1,Stasis(dtaxi,client,driver)
 same => n,Hangup()
exten => dispatcher,1,Stasis(dtaxi,client,dispatcher)
 same => n,Hangup()
exten => _X.,1,Hangup()
exten => _[a-zA-Z+].,1,Hangup()

; Faol bo'lmagan foydalanuvchilar
[inactive]
exten => _X.,1,Hangup()
